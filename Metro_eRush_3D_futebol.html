<style>

.ib{position:absolute;left:0;right:0;height:9vh;background:#000}.ib.t{top:0}.ib.b{bottom:0}
#itx{position:absolute;left:0;right:0;bottom:calc(9vh + 18px);text-align:center;font-size:clamp(22px,6vw,34px);font-weight:900;text-shadow:0 3px 10px #000,0 0 18px #000a;letter-spacing:2px}

#atx{position:absolute;left:0;right:0;bottom:calc(8vh + 22px);text-align:center;font-size:clamp(24px,7vw,40px);font-weight:900;font-style:italic;letter-spacing:2px;text-shadow:0 3px 10px #000,0 0 22px #1b8a2ecc;opacity:0}
#atx.pop{animation:apop .7s ease-out forwards}
@keyframes apop{0%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const M0=$('m').innerHTML;
let slam=false,gyv=0,hbCd=0,lastTap=0,lvl=0;
// ===== HOVERBOARD (duplo toque): duração e recarga em segundos =====
const HB_TEMPO=20,HB_RECARGA=30;
function spdAt(d){const b=modeI===2?22:14,c=modeI===2?40:36;return Math.min(c,b+d*.02)}
const FREEZE=4; // segundos que o contador fica parado ao encostar numa moeda
let S={};try{S=JSON.parse(localStorage.getItem('mr3')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mr3',JSON.stringify(S))}catch(e){}};
let mapI=S.map||0,skinI=S.skin||0,noCoin=false;
const weak=()=>(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3;
const R=new THREE.WebGLRenderer({antialias:!(S.q==='low'||((S.q||'auto')==='auto'&&weak()))});R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd3ff);scene.fog=new THREE.Fog(0x8fd3ff,25,110);
const cam=new THREE.PerspectiveCamera(65,1,.1,300);cam.position.set(0,2.4,5);
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?75:62;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const hemi=new THREE.HemisphereLight(0xffffff,0x445566,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2cc,.8);sun.position.set(5,12,6);scene.add(sun);
// ---------- helpers
const mats={};const Mc=(c,e)=>{const k=c+(e?'e':'');return mats[k]||(mats[k]=new THREE.MeshLambertMaterial(e?{color:c,emissive:c,emissiveIntensity:.7}:{color:c}))};
const UB=new THREE.BoxGeometry(1,1,1),UC=new THREE.CylinderGeometry(1,1,1,10),UK=new THREE.ConeGeometry(1,1,8),US=new THREE.SphereGeometry(1,14,10);
const mesh=(g,w,h,d,c,e)=>{const m=new THREE.Mesh(g,Mc(c,e));m.scale.set(w,h,d);return m};
const box=(w,h,d,c,e)=>mesh(UB,w,h,d,c,e),cy=(r,h,c,e)=>mesh(UC,r,h,r,c,e),co=(r,h,c,e)=>mesh(UK,r,h,r,c,e),sp=(r,c,e)=>mesh(US,r,r,r,c,e);
const pick=a=>a[Math.random()*a.length|0];
const at=(m,x,y,z)=>{m.position.set(x,y,z);return m},add=(p,...c)=>c.forEach(x=>p.add(x));
const LW=2.2,hx=c=>'#'+c.toString(16).padStart(6,'0');
// ---------- chão
const own=(w,h,d)=>{const m=new THREE.Mesh(UB,new THREE.MeshLambertMaterial());m.scale.set(w,h,d);return m};
const ground=own(LW*3+.8,.2,260);ground.position.set(0,-.1,-100);scene.add(ground);
const side=own(40,.2,260);side.position.set(0,-.3,-100);scene.add(side);
const lineM=new THREE.MeshLambertMaterial({color:0xdddddd}),slM=new THREE.MeshLambertMaterial({color:0x2a2d36});
for(const x of[-1.5,-.5,.5,1.5]){const l=new THREE.Mesh(UB,lineM);l.scale.set(.07,.02,260);l.position.set(x*LW,.01,-100);scene.add(l)}
const sleepers=[];for(let i=0;i<26;i++){const s=new THREE.Mesh(UB,slM);s.scale.set(LW*3,.05,.35);s.position.set(0,.02,-i*4+8);scene.add(s);sleepers.push(s)}
// ---------- céu
const sunM=new THREE.Mesh(new THREE.SphereGeometry(7,16,12),new THREE.MeshBasicMaterial({color:0xfff0a0,fog:false}));
const moonM=new THREE.Mesh(new THREE.SphereGeometry(5,16,12),new THREE.MeshBasicMaterial({color:0xe6ecff,fog:false}));
scene.add(sunM,moonM);
const sp3=[];for(let i=0;i<260;i++){const a=Math.random()*6.283,e=Math.random()*1.3+.1,r=150;sp3.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,-Math.abs(Math.sin(a)*Math.cos(e)*r)-20)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp3,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,transparent:true,opacity:0,fog:false}));scene.add(stars);
const NIGHT=new THREE.Color(0x0a1030),ORG=new THREE.Color(0xff8a50),tc=new THREE.Color(),dc=new THREE.Color();
let dn=.25,kDay=1; // dia fixo
function sky(){const k=kDay=Math.min(1,Math.max(0,.5+.7*Math.sin(dn*6.2832)));
 dc.setHex(MAPS[mapI].sky);tc.copy(NIGHT).lerp(dc,k);tc.lerp(ORG,(1-Math.abs(2*k-1))*.25);
 scene.background.copy(tc);scene.fog.color.copy(tc);hemi.intensity=.25+.65*k;sun.intensity=.1+.75*k;
 const a=dn*6.2832;sunM.position.set(Math.cos(a)*45,Math.sin(a)*45+5,-100);moonM.position.set(-Math.cos(a)*45,-Math.sin(a)*45+5,-100);
 stars.material.opacity=1-k;stars.visible=k<.95}
// ---------- mapas
const MAPS=[
{n:'🚇 Metrô',sky:0x8fd3ff,road:0x4b5060,side:0x6b8f5a,sl:0x2a2d36,pr:['bld']},
{n:'🏖️ Praia',sky:0x7ec8ff,road:0xf3e3a0,side:0xf7e9b0,sl:0xe0c97a,pr:['palm','umb','palm','umb']},
